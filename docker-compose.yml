services:

  postgres:
    image: postgres:17
    container_name: resume-postgres
    environment:
      POSTGRES_DB: resumeDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      PGPORT: 5433
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'
    ports:
      - "5433:5433"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - resume-net
    profiles: [ "local", "test", "prod" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -p 5433 -U postgres -d resumeDb" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: resume-redis
    ports:
      - "6379:6379"
    networks:
      - resume-net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    profiles: [ "local", "test", "prod" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: resume-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:19092,EXTERNAL://localhost:9092'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29092'
      KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # A random UUID for the cluster (required for KRaft)
      CLUSTER_ID: 'MkU3MzY1ODZ3NHA5RzI4Sg=='
    networks:
      - resume-net
    deploy:
      resources:
        limits:
          memory: 450M
          cpus: '0.50'
    profiles: [ "local", "test", "prod" ]
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 9092" ]
      interval: 10s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5433/resumeDb?options=-c%20timezone=Asia/Kolkata
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-minimax-m2.5:cloud}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost,https://simulation-least-lauren-venice.trycloudflare.com}
      TZ: Asia/Kolkata
    networks:
      - resume-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.00'
    profiles: [ "test", "prod" ]

  frontend:
    build:
      context: ../ResumeAi
      dockerfile: Dockerfile
    container_name: resume-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - resume-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'
    profiles: [ "prod" ]

volumes:
  postgres_data:


networks:
  resume-net:
