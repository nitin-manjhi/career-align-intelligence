version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: resume-postgres
    environment:
      POSTGRES_DB: resumeDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Srcem@123
      PGPORT: 5433
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    ports:
      - "5433:5433"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - resume-net
    profiles: [ "local", "test", "prod" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -p 5433 -U postgres -d resumeDb" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: resume-redis
    ports:
      - "6379:6379"
    networks:
      - resume-net
    profiles: [ "local", "test", "prod" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: resume-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - resume-net
    profiles: [ "local", "test", "prod" ]

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: resume-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - resume-net
    profiles: [ "local", "test", "prod" ]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5433/resumeDb?options=-c%20timezone=Asia/Kolkata
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-Srcem@123}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-minimax-m2.5:cloud}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost,https://simulation-least-lauren-venice.trycloudflare.com}
      TZ: Asia/Kolkata
    networks:
      - resume-net
    profiles: [ "test", "prod" ]

  frontend:
    build:
      context: ../ResumeAi
      dockerfile: Dockerfile
    container_name: resume-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - resume-net
    profiles: [ "prod" ]

volumes:
  postgres_data:


networks:
  resume-net:
