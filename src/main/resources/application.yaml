kafka:
  topic:
    analysis-job-topic: RESUME.AI.ANALYSIS_JOB_TOPIC
    skill-analysis-job-topic: SKILL.AI.ANALYSIS_JOB_TOPIC
    job-search-topic: JOB_SEARCH_TOPIC

spring:
  application:
    name: career-align-intelligence

  autoconfigure:
    exclude:
      - org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration
      - org.springframework.ai.autoconfigure.openai.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.autoconfigure.google.genai.GoogleGenAiEmbeddingAutoConfiguration

  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.LongSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  # AI Provider Logic
  app:
    ai:
      chat-provider: cloud

  # Spring AI Standard Configurations - Global defaults that don't depend on credentials
  ai:
    openai:
      base-url: https://openrouter.ai/api
      chat:
        options:
          model: nvidia/nemotron-3-nano-30b-a3b:free
    google:
      genai:
        chat:
          options:
            model: gemini-2.5-flash-lite

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: false

  sql:
    init:
      mode: never

  # flyway configuration for database migrations
  flyway:
    enabled: true
    locations: classpath:db/migration
    baselineOnMigrate: true
    baselineVersion: 0

logging:
  level:
    org.springframework.ai:
      chat.client: DEBUG

server:
  port: 8080
