kafka.topic.analysis-job-topic: RESUME.AI.ANALYSIS_JOB_TOPIC
kafka.topic.skill-analysis-job-topic: SKILL.AI.ANALYSIS_JOB_TOPIC
spring:
  application:
    name: career-align-intelligence

  #redis configuration for caching and session management
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 60000
  # kafka configuration for both producer and consumer
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.LongSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  # AI configuration for Ollama
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:https://ollama.com}
      chat:
        options:
          model: ${OLLAMA_MODEL:minimax-m2.5:cloud}

    openai:
      api-key: ${OPENAI_API_KEY:REQUIRED_FOR_OPENAI}
      chat:
        options:
          model: gpt-4o-mini

    google:
      genai:
        api-key: ${GEMINI_API_KEY:REQUIRED_FOR_GEMINI}
        chat:
          options:
            model: gemini-2.5-flash-lite

    #  DB configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/resumeDb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: false
  sql:
    init:
      mode: never
  # flyway configuration for database migrations
  flyway:
    enabled: true
    locations: classpath:db/migration
    baselineOnMigrate: true
    baselineVersion: 0
#    validateOnMigrate: false
#    repairOnMigrate: true
# AI  Logging configuration for Ollama
logging:
  level:
    org.springframework.ai:
      chat.client: DEBUG
jwt:
