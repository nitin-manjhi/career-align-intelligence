spring:
  datasource:
    url: jdbc:postgresql://postgres:5433/resumeDb?options=-c%20timezone=Asia/Kolkata
    username: postgres
    password: ${SPRING_DATASOURCE_PASSWORD:postgres123}
  data:
    redis:
      host: redis
      port: 6379
  kafka:
    bootstrap-servers: kafka:19092

  ollama:
    cloud:
      base-url: ${OLLAMA_BASE_URL:https://ollama.com}
      chat-model: ${OLLAMA_MODEL:minimax-m2.5:cloud}
      api-key: ${OLLAMA_API_KEY:}

logging:
  level:
    org.springframework.ai: INFO
